{% extends "base.html" %}

{% block title %}My profile{% endblock %}

{% block content %}
<h1>My profile</h1>

{% if profile.picture %}
  <img src="{{ profile.picture.url }}" alt="Your profile picture" width="120">
{% endif %}

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ name_form.as_p }}
  {{ picture_form.as_p }}
  <button type="submit">Save</button>
</form>

<p><a href="{% url 'accounts:view_profile' request.user.username %}">View my public profile</a></p>
{% endblock %}
