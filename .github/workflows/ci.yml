name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      # Scheduled runs always start from the default branch (develop); test main instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - name: Record checked-out commit
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event_name == 'schedule' && 'main' || github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==26.10.1 flake8==7.4.1 coverage

      - name: Migrate and collect static
        run: |
          python manage.py migrate
          python manage.py collectstatic --noinput

      - name: Test
        run: coverage run --source=nycfood,search,restaurants,accounts,community manage.py test

      - name: Format and lint
        run: |
          black --check .
          flake8 .

      - name: Convert coverage to LCOV
        if: success()
        run: coverage lcov -o coverage.lcov

      - name: Upload coverage
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
          git-branch: ${{ steps.rev.outputs.branch }}
          git-commit: ${{ steps.rev.outputs.sha }}

  deploy-integration:
    needs: test
    # Integration: develop pushes, and same-repo PRs into develop.
    # Fork PRs cannot assume the deploy role (no OIDC/secrets). Production stays push-to-main only.
    if: >
      github.repository == 'gcivil-nyu-org/team-3-fall26' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-22.04
    concurrency:
      group: nycfood-integration-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322134621417:role/github-nycfood-deploy
          aws-region: us-east-1

      - name: Deploy
        run: eb deploy Nycfood-env

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gcivil-nyu-org/team-3-fall26'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322134621417:role/github-nycfood-deploy
          aws-region: us-east-1

      - name: Deploy
        run: eb deploy Nycfood-env-main
