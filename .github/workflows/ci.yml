name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Fork PRs into develop. A `pull_request` run from a fork gets no AWS
  # credentials on a public repo, so it can test but not deploy. This run has
  # them, so it only does anything for fork PRs opened by owners, members and
  # collaborators (see TRUSTED_FORK_PR below); every other PR is skipped here.
  # GitHub reads this file from the base branch (develop), not from the PR.
  pull_request_target:
    branches: [develop]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  test:
    # TRUSTED_FORK_PR: a fork PR into develop whose author is an owner, member
    # or collaborator. The same check gates deploy-integration below.
    if: >
      github.event_name != 'pull_request_target' ||
      (
        github.event.pull_request.head.repo.full_name != github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-22.04
    steps:
      # Scheduled runs always start from the default branch (develop); test main instead.
      # pull_request_target starts from develop too; test the PR merged into develop,
      # the same commit a `pull_request` run tests.
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || (github.event_name == 'schedule' && 'main' || '') }}
          persist-credentials: false

      - name: Record checked-out commit
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event_name == 'schedule' && 'main' || github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==26.10.1 flake8==7.4.1 coverage

      - name: Migrate and collect static
        run: |
          python manage.py migrate --database=community
          python manage.py migrate --database=users
          python manage.py migrate
          python manage.py collectstatic --noinput

      - name: Test
        run: coverage run --source=nycfood,search,restaurants,accounts,community,assistant manage.py test

      - name: Format and lint
        run: |
          black --check .
          flake8 .

      - name: Convert coverage to LCOV
        if: success()
        run: coverage lcov -o coverage.lcov

      - name: Upload coverage
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
          git-branch: ${{ steps.rev.outputs.branch }}
          git-commit: ${{ steps.rev.outputs.sha }}

  deploy-integration:
    needs: test
    # Integration: develop pushes, same-repo PRs into develop (pull_request),
    # and TRUSTED_FORK_PRs into develop (pull_request_target). Fork PRs from
    # anyone else only run tests. Production stays push-to-main only.
    if: >
      github.repository == 'gcivil-nyu-org/team-3-fall26' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.base_ref == 'develop' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        )
      )
    runs-on: ubuntu-22.04
    concurrency:
      group: nycfood-integration-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # A fork PR deploys the PR merged into develop, like a same-repo PR.
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || '' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322134621417:role/github-nycfood-deploy
          aws-region: us-east-1

      - name: Deploy
        run: eb deploy Nycfood-env

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gcivil-nyu-org/team-3-fall26'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322134621417:role/github-nycfood-deploy
          aws-region: us-east-1

      - name: Deploy
        run: eb deploy Nycfood-env-main
